<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UNESCO Map</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #map {
        height: 100%;
        width: 100%;
      }

      /* bootstrap cluster */
      .marker-cluster-small {
        background-color: rgba(107, 114, 128, 0.18);
      }
      .marker-cluster-small div {
        background-color: rgba(107, 114, 128, 0.55);
        color: #fff;
        font-weight: 700;
      }

      .marker-cluster-medium {
        background-color: rgba(77, 163, 255, 0.25);
      }
      .marker-cluster-medium div {
        background-color: rgba(77, 163, 255, 0.85);
        color: #fff;
        font-weight: 700;
      }

      .marker-cluster-large {
        background-color: rgba(30, 64, 175, 0.25);
      }
      .marker-cluster-large div {
        background-color: rgba(30, 64, 175, 0.9);
        color: #fff;
        font-weight: 800;
      }

      /* pop-up content */
      .leaflet-popup-content {
        margin: 10px 12px;
        width: clamp(240px, 45vw, 460px);
      }
      .popup-title-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 6px;
      }
      .popup-title {
        font-weight: 800;
        font-size: 16px;
        line-height: 1.2;
      }
      .danger-badge {
        font-weight: 800;
        color: #d32f2f;
        font-size: 12px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        border: 1px solid #d32f2f;
        padding: 2px 6px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .popup-country {
        opacity: 0.8;
        margin-bottom: 8px;
      }
      .popup-meta {
        opacity: 0.8;
        margin-bottom: 8px;
        font-style: italic;
      }
      .popup-built {
        font-weight: 700;
        margin-bottom: 6px;
      }
      .popup-evidence {
        border-left: 3px solid #d7dce3;
        color: #4b5563;
        font-size: 13px;
        line-height: 1.3;
        margin: 0 0 8px 0;
        padding-left: 8px;
      }

      .popup-desc {
        max-height: min(45vh, 260px);
        overflow: auto;
        white-space: normal;
        line-height: 1.35;
      }

      .floating-panel {
        position: fixed;
        top: 16px;
        right: 16px;
        width: 200px;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #ddd;
        border-radius: 10px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        z-index: 9999;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        user-select: none;
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 10px;
        border-bottom: 1px solid #eee;
        font-weight: 700;
      }
      .panel-body {
        padding: 10px 10px 12px 10px;
        font-size: 14px;
        user-select: text;
      }
      .min-btn {
        border: 0;
        background: #f2f2f2;
        width: 28px;
        height: 24px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 18px;
        line-height: 18px;
      }
      .min-btn:hover {
        background: #e8e8e8;
      }

      .panel-status {
        margin-top: 8px;
        font-size: 12px;
        opacity: 0.75;
      }

      /* legend - danger level */
      .map-legend {
        position: fixed;
        bottom: 16px;
        left: 16px;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 14px;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        z-index: 9999;
      }
      .legend-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      /* pop-up image */
      .popup-img {
        width: 100%;
        aspect-ratio: 1200 / 630;
        object-fit: cover;
        border-radius: 8px;
        margin: 8px 0;
        background: #f2f2f2;
        display: block;
      }

      .popup-img-note {
        font-size: 12px;
        opacity: 0.75;
        margin-top: 6px;
      }

      /* timeline */
      .timeline-box {
        position: fixed;
        top: auto;
        left: auto;
        bottom: 16px;
        right: 16px;
        width: min(720px, calc(100vw - 32px));
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 10px 12px;
        z-index: 9999;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        overflow: hidden;
      }

      .timeline-readout {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .timeline-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .timeline-labels {
        position: relative;
        color: #4b5563;
        font-size: 11px;
        height: 46px;
        margin: 7px 52px 0 0;
        overflow: hidden;
      }

      .timeline-labels span {
        position: absolute;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      .timeline-label {
        top: 20px;
      }

      .timeline-tick {
        background: #9ca3af;
        border-radius: 999px;
        display: block;
        height: 8px;
        top: 2px;
        width: 1px;
      }

      .timeline-tick-major {
        background: #6b7280;
        height: 12px;
        width: 2px;
      }

      .timeline-endpoint {
        background: #6b7280;
        height: 12px;
        width: 2px;
        z-index: 2;
      }

      .timeline-label-left {
        transform: translateX(0);
      }

      .timeline-label-long {
        line-height: 1.05;
        max-width: 58px;
        text-align: left;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .timeline-label-right {
        transform: translateX(-100%);
      }

      .timeline-slider {
        width: 100%;
      }

      .timeline-clear {
	  border: 1px solid #ddd;
	  background: #fff;
	  border-radius: 8px;
	  padding: 0 12px;
	  height: 36px;
	  min-height: 36px;
	  display: inline-flex;
	  align-items: center;
	  justify-content: center;
	  box-sizing: border-box;
	  white-space: nowrap;
	  cursor: pointer;
	  font-size: 12px;
	}
      .timeline-clear:hover {
        background: #f7f7f7;
      }
      .timeline-clear.is-active {
        background: #111827;
        border-color: #111827;
        color: #fff;
      }
	  
    </style>
  </head>

  <body>
    <div id="map"></div>

    <div id="filterPanel" class="floating-panel">
      <div class="panel-header">
        <span>Categories</span>
        <button id="togglePanelBtn" class="min-btn" title="Minimize">–</button>
      </div>

      <div id="panelBody" class="panel-body">
        <label
          ><input type="checkbox" id="chkCultural" checked /> Cultural</label
        ><br />
        <label><input type="checkbox" id="chkNatural" checked /> Natural</label
        ><br />
        <label><input type="checkbox" id="chkMixed" /> Mixed</label>
        <div id="statusLine" class="panel-status">Loading…</div>
      </div>
    </div>

    <div class="map-legend">
      <div class="legend-row">
        <span class="legend-dot" style="background: #1565c0"></span>
        Cultural
      </div>
      <div class="legend-row">
        <span class="legend-dot" style="background: #2e7d32"></span>
        Natural
      </div>
      <div class="legend-row">
        <span class="legend-dot" style="background: #6a1b9a"></span>
        Mixed
      </div>
      <div class="legend-row">
        <span class="legend-dot" style="background: #d32f2f"></span>
        Dangerous
      </div>
    </div>

    <div id="timelineBox" class="timeline-box">
      <div id="timelineReadout" class="timeline-readout">
        Timeline: All dates
      </div>

      <div class="timeline-row">
        <input
          id="timelineSlider"
          class="timeline-slider"
          type="range"
        />
        <button id="timelineClear" class="timeline-clear" type="button">
          All
        </button>
        <button
          id="timelineUnknownToggle"
          class="timeline-clear"
          type="button"
          aria-pressed="false"
        >
          Include Unknown Dates
        </button>
      </div>
      <div id="timelineLabels" class="timeline-labels" aria-hidden="true"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script src="./app.js" defer></script>
  </body>
</html>
